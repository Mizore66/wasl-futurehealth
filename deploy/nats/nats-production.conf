# Production-shaped authenticated TLS cluster. Secrets and certificates are file-mounted and expanded by NATS.
server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
https: 0.0.0.0:8222

tls {
  cert_file: "/run/secrets/server.crt"
  key_file: "/run/secrets/server.key"
  ca_file: "/run/secrets/ca.crt"
  verify: true
}

authorization {
  user: $WASL_NATS_USER
  password: $WASL_NATS_PASSWORD_CONFIG
  timeout: 2
}

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 4GB
  cipher: chachapoly
  key: $WASL_JS_KEY
}

cluster {
  name: wsi
  listen: 0.0.0.0:6222
  no_advertise: true
  tls {
    cert_file: "/run/secrets/server.crt"
    key_file: "/run/secrets/server.key"
    ca_file: "/run/secrets/ca.crt"
    verify: true
  }
  authorization {
    user: $WASL_ROUTE_USER
    password: $WASL_ROUTE_PASSWORD_CONFIG
    timeout: 2
  }
  routes: [nats-route://__WASL_ROUTE_USER__:__WASL_ROUTE_PASSWORD__@nats-0:6222, nats-route://__WASL_ROUTE_USER__:__WASL_ROUTE_PASSWORD__@nats-1:6222, nats-route://__WASL_ROUTE_USER__:__WASL_ROUTE_PASSWORD__@nats-2:6222]
}
