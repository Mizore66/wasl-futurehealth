# NATS JetStream node for the docker-compose deployment (docs/DEPLOY.md). One file for all three nodes:
# NATS_SERVER_NAME (n0|n1|n2) and WASL_JS_KEY come from the container environment, never from this file.
# Same JetStream settings as the orchestrator's local cluster (pipeline/main.go natsConf): file store with
# ChaCha20-Poly1305 encryption at rest; streams are created with 3 replicas by `wsi7 setup`.
server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 4GB
  cipher: chachapoly
  key: $WASL_JS_KEY
}
cluster {
  name: wsi
  listen: 0.0.0.0:6222
  routes: [nats-route://nats-0:6222, nats-route://nats-1:6222, nats-route://nats-2:6222]
}
