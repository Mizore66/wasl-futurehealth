# Wasl policy: every reported vulnerability is release-blocking, including UNKNOWN and development-only findings.
# Do not add ignore-unfixed or blanket ignores to make this scan green. Remediate, or record a reviewed,
# version-pinned, expiring entry in supply-chain/trivyignore.yaml (see "Reviewed exceptions" in README.md).
cache:
  backend: memory
db:
  java-skip-update: true
  no-progress: true
format: json
list-all-pkgs: true
pkg:
  include-dev-deps: true
  relationships:
    - unknown
    - root
    - workspace
    - direct
    - indirect
  types:
    - os
    - library
scan:
  detection-priority: precise
  disable-telemetry: true
  offline: false
  scanners:
    - vuln
  skip-dirs:
    - .git
    - out
    - supply-chain
    - web/.next
    - web/playwright-report
    - web/test-results
  skip-version-check: true
severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL
vulnerability:
  ignore-status: []
  ignore-unfixed: false
  skip-vex-repo-update: true
license:
  full: false
  ignored: []
